# Dependency update PRs (Step 3.3 / plan Step 22). Each PR runs the full CI
# pipeline (tests ×3, lint, dependency-audit, image scan, e2e simulation), so
# merging a green Dependabot PR is the sanctioned upgrade path.
#
# Grouping policy: minor/patch updates for an ecosystem land as ONE PR, so a
# weekly cycle costs ~6 CI runs rather than one per package (the pipeline takes
# ~7 minutes, dominated by build-images and e2e-simulation). Majors are
# deliberately left ungrouped — they get their own PR and their own review.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # duckdb is deliberately held: the manager writes data/db/metrics.db and the
    # backend mounts it read-only, so the pin must move in LOCKSTEP across both
    # services (see CLAUDE.md). Dependabot watches the two directories
    # independently and cannot group across them, so it can only ever propose a
    # one-sided bump (it did, in #30) — a skew risks a storage-format mismatch
    # that no unit test catches. Bump both requirements.txt files in one PR
    # instead; pip-audit and Trivy still surface any duckdb CVE.
    ignore:
      - dependency-name: duckdb
      # bcrypt is held below 5.0: passlib 1.7.4 detects its bcrypt backend via
      # `bcrypt.__about__.__version__`, which 4.1 removed (hence the trapped
      # "error reading bcrypt version" warning in the logs) and 5.0 breaks
      # outright — passlib falls through to _stub_requires_backend and every
      # password hash raises. #37 proposed exactly this bump and failed
      # backend-tests and e2e-simulation for that reason. Clearing it means
      # migrating off the unmaintained passlib (last release 2020) to bcrypt
      # directly or pwdlib, keeping verification of existing $2b$ hashes so no
      # one is locked out. Majors only — 4.x patches still flow.
      - dependency-name: bcrypt
        update-types: ["version-update:semver-major"]
    groups:
      backend-pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /manager
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # duckdb is deliberately held: the manager writes data/db/metrics.db and the
    # backend mounts it read-only, so the pin must move in LOCKSTEP across both
    # services (see CLAUDE.md). Dependabot watches the two directories
    # independently and cannot group across them, so it can only ever propose a
    # one-sided bump (it did, in #30) — a skew risks a storage-format mismatch
    # that no unit test catches. Bump both requirements.txt files in one PR
    # instead; pip-audit and Trivy still surface any duckdb CVE.
    ignore:
      - dependency-name: duckdb
    groups:
      manager-pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # pyasn1 is held at 0.4.8 by the pinned pysnmp 4.4.12 (which requires
    # pyasn1<0.5). Its advisories are consciously deferred to 2026-10-31 in
    # .trivyignore and the pip-audit --ignore-vuln list in workflows/ci.yml;
    # clearing them means migrating the agent to a maintained pysnmp and
    # re-running `make simulation`, not taking a bump. Drop this ignore as part
    # of that migration.
    ignore:
      - dependency-name: pyasn1
    groups:
      agent-pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      frontend-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /manager
      - /agent
      - /snmp-simulator
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
