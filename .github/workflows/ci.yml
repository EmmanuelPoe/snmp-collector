# CI pipeline (Step 3.1 / plan Step 20): tests + builds + e2e smoke on every PR.
# Enable branch protection on `main` requiring these jobs to make them merge-blocking.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install dependencies
        run: pip install -r agent/requirements.txt pytest
      - name: Run agent tests
        working-directory: agent
        run: python -m pytest -q

  manager-tests:
    # The manager container is authoritative for these tests (pinned Starlette;
    # newer local versions produce spurious 401-vs-403 failures).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide docker-compose shim
        run: |
          if ! command -v docker-compose >/dev/null; then
            printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
            sudo chmod +x /usr/local/bin/docker-compose
          fi
      - name: Generate .env
        run: make ensure-env
      - name: Build manager image
        run: docker compose build manager
      - name: Run manager tests in-container
        run: docker compose run --rm --no-deps -T manager python -m pytest -q

  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate .env
        run: make ensure-env
      - name: Build all images
        run: docker compose build

  e2e-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Provide docker-compose shim
        run: |
          if ! command -v docker-compose >/dev/null; then
            printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
            sudo chmod +x /usr/local/bin/docker-compose
          fi
      - name: Start the stack
        run: make up
      - name: Run end-to-end simulation
        run: make simulation
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
