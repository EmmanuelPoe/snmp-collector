# CI pipeline (Step 3.1 / plan Step 20): tests + builds + e2e smoke on every PR.
# Enable branch protection on `main` requiring these jobs to make them merge-blocking.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Lint / format / type-check gates (Step 3.2 / plan Step 21). Same tools as
    # .pre-commit-config.yaml; mypy runs per service (flat module layouts) with
    # the lenient baseline from pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install ruff==0.15.22 mypy==2.3.0
      - name: ruff lint
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: shared/ vendored copies in sync
        run: python scripts/check_shared.py
      - name: mypy (per service)
        run: |
          for svc in backend manager agent; do
            echo "== $svc =="
            (cd "$svc" && mypy --config-file ../pyproject.toml .)
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: prettier check
        run: frontend/node_modules/.bin/prettier --check "frontend/src/**/*.{js,css}" "e2e/*.js"
      - name: eslint
        working-directory: frontend
        run: npx eslint src --max-warnings=0

  secret-scan:
    # Secret scanning (Step 3.4 / plan Step 23). Scans the full git history on
    # every run — the repo is small, and full-history is strictly stronger than
    # per-PR diff scans. Also runs locally as a pre-commit hook.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history
        run: gitleaks git --redact --verbose

  dependency-audit:
    # Dependency scanning (Step 3.3 / plan Step 22). Policy: fail on findings;
    # unfixable ones get an --ignore-vuln entry below with a reason + expiry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: pip-audit backend
        run: pip-audit -r backend/requirements.txt
      - name: pip-audit manager
        run: pip-audit -r manager/requirements.txt
      - name: pip-audit agent
        # Allowlist (re-evaluate at expiry, then treat as a failure):
        # - PYSEC-2026-2263 (pyasn1 0.4.8): fix needs pyasn1>=0.6, which breaks
        #   the pinned pysnmp 4.4.12. Clearing it requires migrating the agent
        #   to a maintained pysnmp and re-running `make simulation`.
        #   Expires 2026-10-31.
        run: pip-audit -r agent/requirements.txt --ignore-vuln PYSEC-2026-2263
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: npm audit (production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install dependencies
        run: pip install -r agent/requirements.txt pytest
      - name: Run agent tests
        working-directory: agent
        run: python -m pytest -q

  frontend-tests:
    # Component tests + coverage floor (Step 3.5 / plan Step 24). The floor is
    # enforced by jest coverageThreshold in frontend/package.json — ratchet it
    # up as coverage grows, never down.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Run component tests with coverage
        run: npm run test:ci --prefix frontend

  manager-tests:
    # The manager container is authoritative for these tests (pinned Starlette;
    # newer local versions produce spurious 401-vs-403 failures).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide docker-compose shim
        run: |
          if ! command -v docker-compose >/dev/null; then
            printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
            sudo chmod +x /usr/local/bin/docker-compose
          fi
      - name: Generate .env
        run: make ensure-env
      - name: Build manager image
        run: docker compose build manager
      - name: Run manager tests in-container
        # File registry backend: --no-deps means no postgres (the DB backend
        # is covered by test_registry_db.py against SQLite).
        run: docker compose run --rm --no-deps -T -e REGISTRY_BACKEND=file manager python -m pytest -q

  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate .env
        run: make ensure-env
      - name: Build all images
        run: docker compose build
      # Image scanning + SBOMs (Step 3.3 / plan Step 22). Only the images we
      # build are scanned — pulled infra images (postgres, nginx) are upgraded
      # via their tags, not fixable here. Policy: fail on *fixable*
      # HIGH/CRITICAL (--ignore-unfixed); exceptions live in .trivyignore with
      # a reason + expiry.
      - name: Install trivy and syft
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          curl -sfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Trivy scan built images
        run: |
          for svc in backend frontend manager agent snmp-simulator; do
            img=$(docker compose config --images "$svc")
            echo "== $img =="
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --ignorefile .trivyignore "$img"
          done
      - name: Generate SBOMs
        run: |
          mkdir -p sboms
          for svc in backend frontend manager agent snmp-simulator; do
            img=$(docker compose config --images "$svc")
            syft "$img" -o spdx-json > "sboms/${svc}.spdx.json"
          done
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-sboms
          path: sboms/

  e2e-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Provide docker-compose shim
        run: |
          if ! command -v docker-compose >/dev/null; then
            printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
            sudo chmod +x /usr/local/bin/docker-compose
          fi
      - name: Start the stack
        run: make up
      # Playwright browser E2E (Step 3.5 / plan Step 24) runs first: it
      # consumes the one-time bootstrap password and sets a known one, which
      # the API-level simulation then reuses.
      - name: Extract bootstrap admin password
        run: |
          for i in $(seq 1 30); do
            PW=$(docker compose logs backend 2>/dev/null \
              | grep -o 'login with admin@localhost / [^ ]*' | tail -n 1 | awk '{print $5}')
            [ -n "$PW" ] && break
            sleep 2
          done
          if [ -z "$PW" ]; then
            echo "No bootstrap password found in backend logs" >&2
            exit 1
          fi
          echo "::add-mask::$PW"
          echo "E2E_BOOTSTRAP_PASSWORD=$PW" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        run: |
          npm ci --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium
      - name: Run browser E2E
        env:
          E2E_NEW_PASSWORD: E2e-Playwright!234
        run: npm test --prefix e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
      - name: Run end-to-end simulation
        env:
          SIM_ADMIN_EMAIL: admin@localhost
          SIM_ADMIN_PASSWORD: E2e-Playwright!234
        run: make simulation
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
