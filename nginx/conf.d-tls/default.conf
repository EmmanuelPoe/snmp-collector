# TLS vhost (Step 1.6 / plan Step 18). Activated by docker-compose.tls.yml,
# which mounts this directory over /etc/nginx/conf.d and ./nginx/certs over
# /etc/nginx/certs. Keep the proxy locations in sync with conf.d/default.conf
# (the plain-HTTP dev vhost) — this file adds TLS, HSTS, and the /agent/ route.
# Cert setup: docs/runbooks/tls.md (self-signed bootstrap: scripts/gen_self_signed_cert.sh).

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/security_headers.inc;
    # HSTS starts low (5 min) during rollout so a TLS misconfiguration is not
    # sticky; raise to 6 months (15768000) once stable. See docs/runbooks/tls.md.
    add_header Strict-Transport-Security "max-age=300" always;

    # Re-resolve upstream container IPs at request time via Docker's embedded
    # DNS, so rebuilding backend/frontend (new container IP) does not strand
    # nginx on a stale address (cause of intermittent 502s). Hostnames are held
    # in variables to force runtime resolution instead of one-time startup
    # resolution (the behaviour of `upstream {}` / literal proxy_pass).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/internal/ {
        deny all;
    }

    location /api/ {
        # `set` must precede `rewrite ... break` — break ends the rewrite phase,
        # which would otherwise skip the set and leave the upstream var empty.
        set $backend_upstream backend:8000;
        # Strip the /api/ prefix, then proxy (matches the old `proxy_pass .../;`).
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Remote agents reach the manager through TLS here (MANAGER_URL=
    # https://<host>/agent) so SNMP credentials in device-config responses are
    # never sent in cleartext. Compose-internal traffic (backend<->manager,
    # local agent) keeps using http://manager:8000 on the docker network.
    location /agent/ {
        set $manager_upstream manager:8000;
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass http://$manager_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Parquet ingest uploads can exceed the 1m nginx default.
        client_max_body_size 50m;
    }

    location /health {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/health;
        proxy_set_header Host $host;
    }

    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
