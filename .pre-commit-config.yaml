# Lint/format hooks (Step 3.2 / plan Step 21). Install once with:
#   pre-commit install
# CI runs the same tools in the `lint` job — pre-commit is the fast local gate.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # prettier/eslint resolve from frontend/node_modules — run `npm install
      # --prefix frontend` first. Config: frontend/.prettierrc + the CRA
      # eslintConfig in frontend/package.json.
      - id: prettier
        name: prettier (frontend)
        language: system
        entry: frontend/node_modules/.bin/prettier --check
        files: ^frontend/src/.*\.(js|css)$
      - id: eslint
        name: eslint (frontend)
        language: system
        entry: frontend/node_modules/.bin/eslint --max-warnings=0
        files: ^frontend/src/.*\.js$
